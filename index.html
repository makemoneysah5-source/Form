<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Contact Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .form-container h2 {
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #006699;
        }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Contact Us</h2>
    <form id="telegramForm">
        <div class="form-group">
            <label for="name">Naam (Name):</label>
            <input type="text" id="name" required placeholder="Aapka naam">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required placeholder="Aapka email">
        </div>
        <div class="form-group">
            <label for="message">Sandesh (Message):</label>
            <textarea id="message" rows="4" required placeholder="Aapka message..."></textarea>
        </div>
        <button type="submit">Send to Telegram</button>
    </form>
    <div id="statusMessage"></div>
</div>

<script>
    document.getElementById('telegramForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // ⚠️ Apna Bot Token aur Chat ID yahan dalein
        const botToken = '8763151429:AAHHoeHS7ctD9r865pHhM7VCC2j4VQ2-zAk';
        const chatId = '6644554566';

        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const message = document.getElementById('message').value;

        // Telegram message format
        const text = `📬 *Naya Form Submission*\n\n👤 *Naam:* ${name}\n📧 *Email:* ${email}\n💬 *Message:* ${message}`;

        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

        const statusDiv = document.getElementById('statusMessage');
        statusDiv.style.color = 'black';
        statusDiv.innerText = 'Bhej raha hai...';

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                chat_id: chatId,
                text: text,
                parse_mode: 'Markdown'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                statusDiv.style.color = 'green';
                statusDiv.innerText = 'Data Telegram par safaltapoorvak bhej diya gaya!';
                document.getElementById('telegramForm').reset();
            } else {
                statusDiv.style.color = 'red';
                statusDiv.innerText = 'Kuch galti hui: ' + data.description;
            }
        })
        .catch(error => {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Network error ya galat details!';
            console.error('Error:', error);
        });
    });
</script>

</body>
</html>
