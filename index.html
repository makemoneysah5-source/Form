<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send TikTok Reward</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 22px;
            color: #fe2c55;
        }

        .input-group {
            width: 100%;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            font-size: 15px;
            text-align: center;
        }

        input:focus {
            border-color: #fe2c55;
        }

        .profile-container {
            margin-top: 15px;
            display: none;
        }

        .avatar-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fe2c55;
            margin-bottom: 12px;
        }

        .user-handle {
            font-size: 16px;
            font-weight: bold;
            color: #25f4ee;
            margin-bottom: 20px;
        }

        .reward-btn {
            background-color: #fe2c55;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: 0.2s;
        }

        .reward-btn:hover {
            background-color: #e02648;
        }

        /* Modal / Popup Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px 0;
        }

        .modal-content {
            background: #222;
            padding: 25px;
            border-radius: 14px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .preset-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 15px 0;
        }

        .preset-btn {
            background: #333;
            color: #fff;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 13px;
            border: none;
            cursor: pointer;
        }

        /* Processing Loader & Tick Screen */
        .process-box {
            display: none;
            padding: 20px 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #fe2c55;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tick-circle {
            width: 60px;
            height: 60px;
            background: #25f4ee;
            color: #000;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 15px auto;
        }

        /* Receipt Box Styles */
        .receipt {
            display: none;
            background: #ffffff;
            color: #000000;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
        }

        .receipt-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #fe2c55;
            margin: 5px auto 15px auto;
            display: block;
        }

        .receipt-header {
            border-bottom: 2px dashed #000;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            text-align: left;
        }

        .receipt-footer {
            border-top: 2px dashed #000;
            padding-top: 12px;
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
            color: #d90429;
        }

        .home-btn {
            width: 100%;
            margin-top: 15px;
            background: #121212;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 14px;
        }

        .home-btn:hover {
            background: #222;
        }

        .error {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .loader {
            display: none;
            margin: 15px 0;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Home Page Heading -->
        <h2>Send TikTok Reward</h2>
        
        <div class="input-group">
            <input type="text" id="usernameInput" placeholder="Type username..." oninput="handleAutoSearch()">
        </div>

        <div class="loader" id="loader">Searching user...</div>
        <div class="error" id="errorMessage">User nahi mila!</div>

        <div class="profile-container" id="profileContainer">
            <img src="" alt="TikTok Avatar" id="avatarImg" class="avatar-img">
            <div class="user-handle" id="userHandle">@username</div>

            <button class="reward-btn" onclick="openRewardModal()">🎁 Send Reward</button>
        </div>
    </div>

    <!-- Modal Popup -->
    <div class="modal" id="rewardModal">
        <div class="modal-content">
            <span class="close-btn" onclick="goToHome()">&times;</span>

            <!-- Step 1: Input Form -->
            <div id="rewardForm">
                <h3 style="margin-bottom: 10px; color: #fe2c55;">Send Reward</h3>
                <p style="font-size: 13px; color: #ccc;">Enter amount for <span id="rewardTargetUser" style="color: #25f4ee; font-weight: bold;"></span></p>

                <div class="preset-container">
                    <button class="preset-btn" onclick="setAmount(10)">₹10</button>
                    <button class="preset-btn" onclick="setAmount(50)">₹50</button>
                    <button class="preset-btn" onclick="setAmount(100)">₹100</button>
                </div>

                <input type="number" id="rewardAmount" placeholder="Enter Amount (₹)" style="width: 100%; margin-bottom: 15px;">
                <button onclick="processReward()" style="width: 100%; background: #fe2c55; color: #fff; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Confirm & Send</button>
            </div>

            <!-- Step 2: Processing & Tick Mark -->
            <div class="process-box" id="processBox">
                <div id="loadingState">
                    <div class="spinner"></div>
                    <p style="color: #ccc; font-size: 15px;">Processing Payment...</p>
                </div>
                <div id="successState" style="display: none;">
                    <div class="tick-circle">✓</div>
                    <p style="color: #25f4ee; font-size: 16px; font-weight: bold;">Payment Successful!</p>
                </div>
            </div>

            <!-- Step 3: Receipt Only -->
            <div class="receipt" id="receiptBox">
                <img src="" id="receiptAvatarImg" class="receipt-avatar" alt="User Avatar">

                <div class="receipt-header">
                    <h3 style="margin-bottom: 5px;">REWARD RECEIPT</h3>
                    <small>STATUS: SUCCESSFUL</small>
                </div>

                <div class="receipt-row">
                    <span>Txn ID:</span>
                    <span id="rcptTxnId">#123456</span>
                </div>
                <div class="receipt-row">
                    <span>Date:</span>
                    <span id="rcptDate">--/--/----</span>
                </div>
                <div class="receipt-row">
                    <span>Recipient:</span>
                    <span id="rcptUser">@user</span>
                </div>
                <div class="receipt-row" style="font-weight: bold;">
                    <span>Amount:</span>
                    <span id="rcptAmount">₹0</span>
                </div>

                <div class="receipt-footer">
                    Your reward receive within 24Hr
                </div>

                <!-- Go To Home Button -->
                <button class="home-btn" onclick="goToHome()">🏠 Go to Home</button>
            </div>
        </div>
    </div>

    <script>
        let currentTargetUser = '';
        let currentAvatarUrl = '';
        let searchTimer;

        function handleAutoSearch() {
            clearTimeout(searchTimer);
            const username = document.getElementById('usernameInput').value.trim();

            if (!username) {
                document.getElementById('profileContainer').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'none';
                return;
            }

            searchTimer = setTimeout(() => {
                fetchAvatar(username);
            }, 600);
        }

        async function fetchAvatar(username) {
            const loader = document.getElementById('loader');
            const error = document.getElementById('errorMessage');
            const container = document.getElementById('profileContainer');

            if (username.startsWith('@')) username = username.substring(1);

            loader.style.display = 'block';
            error.style.display = 'none';
            container.style.display = 'none';

            try {
                const res = await fetch(`https://unavatar.io/tiktok/${username}?json`);
                const data = await res.json();

                if (data && data.url) {
                    currentTargetUser = `@${username}`;
                    currentAvatarUrl = data.url;

                    document.getElementById('avatarImg').src = currentAvatarUrl;
                    document.getElementById('userHandle').innerText = currentTargetUser;

                    loader.style.display = 'none';
                    container.style.display = 'block';
                } else {
                    throw new Error('Not found');
                }
            } catch (err) {
                loader.style.display = 'none';
                error.innerText = "User avatar nahi mila.";
                error.style.display = 'block';
            }
        }

        function openRewardModal() {
            document.getElementById('rewardTargetUser').innerText = currentTargetUser;
            document.getElementById('rewardAmount').value = '';
            
            // Reset modal states
            document.getElementById('rewardForm').style.display = 'block';
            document.getElementById('processBox').style.display = 'none';
            document.getElementById('receiptBox').style.display = 'none';
            
            document.getElementById('rewardModal').style.display = 'flex';
        }

        function setAmount(val) {
            document.getElementById('rewardAmount').value = val;
        }

        function processReward() {
            const amount = document.getElementById('rewardAmount').value;
            if (!amount || amount <= 0) {
                alert('Kripya sahi amount dalein.');
                return;
            }

            // Hide Form & Show Processing Loader
            document.getElementById('rewardForm').style.display = 'none';
            document.getElementById('processBox').style.display = 'block';
            document.getElementById('loadingState').style.display = 'block';
            document.getElementById('successState').style.display = 'none';

            // 1.5 Second Processing Delay
            setTimeout(() => {
                // Show Tick Mark
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('successState').style.display = 'block';

                // 1 Second Delay after Tick -> Show Receipt
                setTimeout(() => {
                    document.getElementById('processBox').style.display = 'none';

                    const txnId = 'TXN' + Math.floor(100000 + Math.random() * 900000);
                    const currentDate = new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                    document.getElementById('receiptAvatarImg').src = currentAvatarUrl;
                    document.getElementById('rcptTxnId').innerText = `#${txnId}`;
                    document.getElementById('rcptDate').innerText = currentDate;
                    document.getElementById('rcptUser').innerText = currentTargetUser;
                    document.getElementById('rcptAmount').innerText = `₹${amount}`;

                    document.getElementById('receiptBox').style.display = 'block';
                }, 1000);

            }, 1500);
        }

        function goToHome() {
            document.getElementById('rewardModal').style.display = 'none';
            document.getElementById('usernameInput').value = '';
            document.getElementById('profileContainer').style.display = 'none';
        }
    </script>

</body>
</html>
